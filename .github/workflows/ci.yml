name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:css
      - run: npm test
      - run: npm run build
  dxf-extractor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ezdxf==1.4.4 pillow pytest  # ezdxf.addons.drawing imports Pillow
      - run: pytest -q packages/engine/src/dxf packages/engine/src/pipeline apps/web/src/console
